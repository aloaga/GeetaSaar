name: Generate Daily Shloka

on:
  schedule:
    # 06:30 UTC is exactly 12:00 PM IST
    - cron: '30 6 * * *'
  workflow_dispatch: # This adds a manual "Run" button for testing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Run Python script
        run: python generate.py

      - name: Commit and push the new binary file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shloka.bin
          # It will only commit if the file actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily shloka update"
          git push
